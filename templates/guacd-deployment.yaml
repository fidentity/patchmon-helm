{{- if .Values.guacd.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "patchmon.guacd.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "patchmon.guacd.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.guacd.replicaCount }}
  {{- with .Values.guacd.updateStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "patchmon.guacd.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "patchmon.guacd.selectorLabels" . | nindent 8 }}
        {{- with .Values.guacd.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if or .Values.guacd.podAnnotations .Values.commonAnnotations }}
      annotations:
        {{- with .Values.commonAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.guacd.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "patchmon.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.guacd.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.guacd.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      containers:
        - name: guacd
          image: {{ include "patchmon.guacd.image" . }}
          imagePullPolicy: {{ .Values.guacd.image.pullPolicy }}
          {{- with .Values.guacd.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: guacd
              containerPort: 4822
              protocol: TCP
          {{- if .Values.guacd.livenessProbe.enabled }}
          livenessProbe:
            tcpSocket:
              port: guacd
            initialDelaySeconds: {{ .Values.guacd.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.guacd.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.guacd.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.guacd.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.guacd.readinessProbe.enabled }}
          readinessProbe:
            tcpSocket:
              port: guacd
            initialDelaySeconds: {{ .Values.guacd.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.guacd.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.guacd.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.guacd.readinessProbe.failureThreshold }}
          {{- end }}
          {{- with .Values.guacd.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.guacd.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            # guacd writes per-connection scratch files here, so /tmp has to be
            # writeable even though the root filesystem is not.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.guacd.tmpSizeLimit }}
      {{- with .Values.guacd.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.guacd.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.guacd.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.guacd.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
