{{- if .Values.secret.create -}}
{{- include "patchmon.validateValues" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "patchmon.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "patchmon.labels" . | nindent 4 }}
  {{- if or .Values.secret.annotations .Values.commonAnnotations }}
  annotations:
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.secret.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
type: Opaque
stringData:
  # Only the credentials that are not sourced from an existingSecret are
  # written here. Nothing is auto-generated: a value that changed on every
  # upgrade would invalidate every session and make every encrypted column
  # unreadable.
  {{- if not .Values.database.auth.existingSecret }}
  {{ .Values.database.auth.existingSecretPasswordKey }}: {{ .Values.database.auth.password | quote }}
  {{- end }}
  {{- if not .Values.redis.auth.existingSecret }}
  {{ .Values.redis.auth.existingSecretPasswordKey }}: {{ .Values.redis.auth.password | quote }}
  {{- end }}
  {{- if not .Values.server.existingSecret }}
  {{ .Values.server.existingSecretJwtKey }}: {{ .Values.server.jwtSecret | quote }}
  {{ .Values.server.existingSecretAiEncryptionKey }}: {{ .Values.server.aiEncryptionKey | quote }}
  {{- with .Values.server.sessionSecret }}
  {{ $.Values.server.existingSecretSessionSecretKey }}: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- if and .Values.server.oidc.enabled (not .Values.server.oidc.existingSecret) (not .Values.server.existingSecret) }}
  {{ .Values.server.oidc.existingSecretClientSecretKey }}: {{ .Values.server.oidc.clientSecret | quote }}
  {{- end }}
{{- end }}
