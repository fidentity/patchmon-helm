name: Lint and template

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: helm lint
        run: |
          helm lint . \
            --set server.jwtSecret=lint \
            --set server.aiEncryptionKey=lint \
            --set database.auth.password=lint \
            --set redis.auth.password=lint

      - name: Render default values
        run: |
          helm template patchmon . \
            --set server.jwtSecret=lint \
            --set server.aiEncryptionKey=lint \
            --set database.auth.password=lint \
            --set redis.auth.password=lint \
            > /tmp/default.yaml

      - name: Render every example
        run: |
          fail=0
          for f in examples/*.yaml; do
            echo "::group::$f"
            helm template patchmon . -f "$f" > "/tmp/$(basename "$f")" || fail=1
            echo "::endgroup::"
          done
          exit $fail

      # Catches what `helm lint` does not: fields that are not in the
      # Kubernetes API at all, and wrong types on the ones that are.
      - name: Validate against Kubernetes schemas
        run: |
          curl -sSL -o /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          /tmp/kubeconform -strict -summary -kubernetes-version 1.30.0 /tmp/*.yaml
